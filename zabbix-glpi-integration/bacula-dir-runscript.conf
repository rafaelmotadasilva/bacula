# Snippet para bacula-dir.conf
# Adicionar dentro de cada JobDef (ou Job) que deve notificar o Zabbix
#
# RunsOnSuccess e RunsOnFailure = yes garante execução em QUALQUER resultado.
# IMPORTANTE: Use RunScript, NÃO RunAfterJob.
# RunAfterJob só executa quando o job termina com status T (sucesso).
#
# Parâmetros passados ao script:
#   %i = JobID      %l = Level (Full/Differential/Incremental)
#   %b = Bytes      %f = Files

JobDefs {
  Name = "DefaultJob"
  # ... suas configurações existentes ...

  RunScript {
    RunsWhen        = After
    RunsOnClient    = no
    FailJobOnError  = no
    RunsOnSuccess   = yes
    RunsOnFailure   = yes
    Command         = "/opt/bacula/scripts/zabbix-notify.sh %i %l %b %f"
  }
}
